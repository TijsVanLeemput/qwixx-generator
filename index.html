<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qwixx Scoreblad</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="fit"><div class="sheet" id="sheet"></div></div>
<div class="under">
  <button id="shuffle" type="button">Nieuwe volgorde</button>
  <span class="divider" aria-hidden="true"></span>
  <span class="print-group">
    <label for="pages">Aantal A4's</label>
    <input id="pages" type="number" min="1" max="100" value="1" inputmode="numeric">
    <button id="print" class="primary" type="button">Afdrukken</button>
  </span>
</div>
<div id="status">4 kaartjes van 12 × 7,5 cm per A4, elk met een eigen willekeurige volgorde.</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="script.js"></script>
</body>
</html>
